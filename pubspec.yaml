name: signspeak

description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  firebase_core: ^3.6.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12

  camera: ^0.12.0+1
  camera_web: ^0.3.5
  hand_landmarker: ^3.0.0
  tflite_flutter: ^0.12.1
  image: ^4.3.0

  flutter_tts: ^4.2.5
  shared_preferences: ^2.2.3
  path_provider: ^2.1.5
  intl: ^0.20.2

  google_mlkit_text_recognition: ^0.15.0
  image_picker: ^1.1.2

  provider: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/sign_language_alphabet.png
    - assets/models/signspeak_model.tflite
    - assets/models/labels.txt

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
